# === GENERAL SETTINGS ===
general {
    gaps_in = 6
    gaps_out = 6

    border_size = 2

  col.active_border = $error
  col.inactive_border = $inverse_primary
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

# === DECORATION ===
decoration {
    rounding = 5
    #rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 5
        render_power = 10
        color = $background
    }

    blur {
        enabled = true
        size = 5
        passes = 5
        contrast = 3
        vibrancy = 10
        vibrancy_darkness = 10

    }
}

