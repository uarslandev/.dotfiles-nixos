font = Anurati-Regular
source = plugins/colors.conf

general {
    hide_cursor = false
    grace = 2
    fractional_scaling = 2
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/firebird/.config/FxP/tmp/curr_wall.png
    blur_passes = 3
    blur_size = 7
    noise = 0.012
    vibrancy = 0.16
    contrast = 0.95
    brightness = 0.80
    color = $shadow
}

# CENTER CLOCK
label {
    monitor =
    text = <span weight="Extrabold">$TIME12</span>
    font_size = 115
    font_family = Anurati-Regular
    color = $primary_fixed_dim
    position = 0, -390
    halign = center
    valign = top
    shadow_passes = 3
    shadow_size = 14
    shadow_color = $shadow
}

# DATE
label {
    monitor =
    text = cmd[update:60000] sh -c 'date +"%A, %B %d, %Y"'
    font_size = 28
    font_family = Anurati-Regular
    color = $primary
    position = 0, -530
    halign = center
    valign = top
    shadow_passes = 1
    shadow_size = 6
    shadow_color = $shadow
}

# GREETING
label {
    monitor =
    text = <span size="xx-large">Welcome, <b>$USER</b>!</span>
    font_size = 32
    font_family = Anurati-Regular
    color = $error
    position = 0, -350
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 10
    shadow_color = $shadow
}

# PASSWORD INPUT
input-field {
    monitor =
    size = 200, 50
    outline_thickness = 10
    font_family = Anurati-Regular
    font_color = $surface_container_low
    inner_color = $primary
    outer_color = $primary_fixed_dim
    check_color = $on_error, $on_error_container, 120deg
    fail_color  = $on_primary_fixed, $on_secondary, 40deg
    fade_on_empty = true
    rounding = 25
    placeholder_text = <i>Type your password…</i>
    fail_text = <span foreground='#FFFFFF'><b>$FAIL</b> ($ATTEMPTS)</span>
    dots_spacing = 0.5
    position = 0, 100
    halign = center
    valign = bottom
    zindex = 3
}

