font = Anurati-Regular
source = colors.conf

general {
    hide_cursor = false
    grace = 2
    fractional_scaling = 2
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/firebird/.config/FxP/tmp/curr_wall.png
    blur_passes = 3
    blur_size = 7
    noise = 0.012
    vibrancy = 0.16
    contrast = 0.95
    brightness = 0.80
    color = rgba(111318ff)
}

# CENTER CLOCK
label {
    monitor =
    text = <span weight="Extrabold">$TIME12</span>
    font_size = 115
    font_family = Anurati-Regular
    color = rgba(dabde2ff)
    position = 0, -390
    halign = center
    valign = top
    shadow_passes = 3
    shadow_size = 14
    shadow_color = rgba(36,39,58,0.68)
}

# DATE
label {
    monitor =
    text = cmd[update:60000] sh -c 'date +"%A, %B %d, %Y"'
    font_size = 28
    font_family = Anurati-Regular
    color = rgba(c3c6cfff)
    position = 0, -530
    halign = center
    valign = top
    shadow_passes = 1
    shadow_size = 6
    shadow_color = rgba(36,39,58,0.25)
}

# GREETING
label {
    monitor =
    text = <span size="xx-large">Welcome, <b>$USER</b>!</span>
    font_size = 32
    font_family = Anurati-Regular
    color = rgba(a6c8ffff)
    position = 0, -350
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 10
    shadow_color = rgba(36,39,58,0.40)
}

# PASSWORD INPUT
input-field {
    monitor =
    size = 200, 50
    outline_thickness = 10
    font_family = Anurati-Regular
    font_color = rgba(e1e2e9ff)
    inner_color = rgba(a6c8ffff)
    outer_color = rgba(a6c8ffff)
    check_color = rgba(bcc7dcff), rgba(a6c8ffff), 120deg
    fail_color  = rgba(ffb4abff), rgba(dabde2ff), 40deg
    fade_on_empty = true
    rounding = 25
    placeholder_text = <i>Type your password…</i>
    fail_text = <span foreground='#f5bde6'><b>$FAIL</b> ($ATTEMPTS)</span>
    dots_spacing = 0.5
    position = 0, 100
    halign = center
    valign = bottom
    zindex = 3
}

