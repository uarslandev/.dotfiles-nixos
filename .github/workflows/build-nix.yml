name: Build Custom NixOS ISO

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Enable Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v7

      - name: Build ISO
        run: |
          nix build .#nixosConfigurations.installer.config.system.build.isoImage

      - name: Prepare ISO artifact
        run: |
          mkdir -p output
          cp result/iso/*.iso output/nixos-custom-zfs.iso
          cd output && sha256sum nixos-custom-zfs.iso > nixos-custom-zfs.iso.sha256

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nixos-custom-zfs-iso
          path: output/*
          retention-days: 7

      - name: Create Release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iso-${{ github.run_id }}
          name: NixOS Custom ZFS Installer (${{ github.run_id }})
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
